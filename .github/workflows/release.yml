# Builds galaxybook-fan's packages and, for a release, attaches them to it:
#   galaxybook-fan-X.Y.Z-1.noarch.rpm      Fedora 44 and 45 (built in fedora:45)
#   galaxybook-fan_X.Y.Z-1_all.deb         Ubuntu 24.04 / 26.04, Mint, Debian 13, MX 25 (built in debian:13)
#   galaxybook-fan-X.Y.Z-1-any.pkg.tar.zst Arch, CachyOS (built in archlinux)
#   PKGBUILD + galaxybook-fan.install      to build that release on Arch instead
#   check-galaxybook-fan.sh                the "will it work?" check, as one file
#   SHA256SUMS
# One package per format: they ship the module's source and DKMS builds it on
# the laptop, so nothing in them depends on the release they were built on.
#
# - A tag v<VERSION> (David's release tool pushes it): checks the versions,
#   builds, creates the release with the CHANGELOG.md section as its notes
#   (.github/release-notes.sh) and attaches the files.
# - Actions -> Release -> Run workflow with an existing tag: the same, and
#   re-attaches the files if the release exists.
# - A pull request: builds the packages only, as artifacts on the run's page
#   (Artifacts), so they can be tested on the laptop before a release.

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.6.0"
        required: true

permissions:
  contents: write

env:
  # Empty for a pull request: build only
  TAG: ${{ inputs.tag || (github.event_name == 'push' && github.ref_name) || '' }}

concurrency:
  group: release-${{ github.event.pull_request.number || inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    name: Check the versions match
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
      - run: |
          version=$(tr -d '[:space:]' < VERSION)
          grep -qx "PACKAGE_VERSION=\"$version\"" module/dkms.conf \
            || { echo "::error::module/dkms.conf's PACKAGE_VERSION isn't $version (VERSION)"; exit 1; }
          grep -q "^PKG_VERSION=\"$version\"" install.sh \
            || { echo "::error::install.sh's PKG_VERSION isn't $version (VERSION)"; exit 1; }
          if [[ -n "$TAG" ]]; then
            [[ "$TAG" == "v$version" ]] \
              || { echo "::error::VERSION is $version, the tag is $TAG"; exit 1; }
            grep -q "^## $version" CHANGELOG.md \
              || { echo "::error::CHANGELOG.md has no '## $version' section"; exit 1; }
          fi

  rpm:
    name: rpm
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: fedora:45
    steps:
      # git before checkout, so the checkout is a repository (build.sh packages
      # the files git knows about)
      - run: dnf -y install git rpm-build systemd-rpm-macros tar gzip
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash packaging/rpm/build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: galaxybook-fan-rpm
          path: packaging/out/*.rpm
          if-no-files-found: error

  deb:
    name: deb
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: debian:13
    steps:
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates build-essential debhelper
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash packaging/debian/build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: galaxybook-fan-deb
          path: packaging/out/*.deb
          if-no-files-found: error

  arch:
    name: Arch package and PKGBUILD
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
      # makepkg refuses to run as root. --nodeps: the package is architecture-
      # independent and needs nothing to build (its depends are for the laptop).
      - name: Build the package
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --nodeps --noconfirm"
          mkdir -p dist
          cp packaging/arch/galaxybook-fan-*-any.pkg.tar.zst dist/
      - name: Write the release PKGBUILD
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          sha=SKIP
          # The release tarball's checksum: only downloadable once the
          # repository is public (and only for a release, not a pull request)
          if [[ -n "$TAG" ]]; then
            if curl -fsSL -o release.tar.gz "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"; then
              sha=$(sha256sum release.tar.gz | cut -d' ' -f1)
            else
              echo "::warning::Release tarball not downloadable (private repository?): the PKGBUILD uses SKIP"
            fi
          fi
          sed -e "s/@VERSION@/$version/g" -e "s/@SHA256@/$sha/g" packaging/arch/PKGBUILD.release.in > dist/PKGBUILD
          cp packaging/arch/galaxybook-fan.install dist/
          bash -n dist/PKGBUILD
      - uses: actions/upload-artifact@v6
        with:
          name: galaxybook-fan-arch
          path: dist/*
          if-no-files-found: error

  check-script:
    name: check-galaxybook-fan.sh
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
      # One file with lib/models.sh and the DSDT parser built in, so users can
      # check their laptop before installing (README, release page)
      - run: |
          bash tools/build-check-script.sh check-galaxybook-fan.sh "$(tr -d '[:space:]' < VERSION)"
          bash -n check-galaxybook-fan.sh
      - uses: actions/upload-artifact@v6
        with:
          name: check-galaxybook-fan
          path: check-galaxybook-fan.sh
          if-no-files-found: error

  publish:
    name: Attach to the release
    if: ${{ inputs.tag || github.event_name == 'push' }}
    needs: [rpm, deb, arch, check-script]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: List the checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release if needed, and attach the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists: (re)attaching the files"
          else
            bash .github/release-notes.sh "$version" > notes.md
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "galaxybook-fan $version" --notes-file notes.md
          fi
          ls -l dist
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
